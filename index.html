<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    

    <style>

        :root {
            --blue: #2092d2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0px;
            height: 100vh;
            display: flex;
            font-family: sans-serif;
        }

        .navigation-section {
            flex: 3;
            background-color: var(--blue);
            font-size: 20px;
            font-weight: bold;
            padding-left: 30px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 50px 50px;
            grid-template-rows: 50px 50px;
            grid-auto-rows: 50px;
            color: white;
        }

        .dashboard-section {
            flex: 8;
            display: flex;
            flex-direction: column;
        }

        .header-main {
            flex: 2;
            display: flex;
            flex-direction: column;
            background-color: white;
        }

        .header-top {
            flex: 2;
            border: 1px solid black;
        }

        .header-bot {
            flex: 3;
        }

        .body-main {
            flex: 9;
            display: flex;
            background-color: whitesmoke;
        }

        .body-left {
            flex: 2;
            border: 1px solid black;
        }

        .body-right {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .body-announcement {
            flex: 1;
            border: 1px solid black;
        }

        .body-trending {
            flex: 1;
        }

    </style>

</head>


<body>

    <div class="navigation-section">
        <div class="grid-container">
            <img src="./images/dashboard.svg">
            <div>Dashboard</div>

            <img>
            <div></div>

            <img src="./images/home.svg">
            <div>Home</div>
            <img src="./images/profile.svg">
            <div>Profile</div>
            <img src="./images/messages.svg">
            <div>Messages</div>
            <img src="./images/history.svg">
            <div>History</div> 
            <img src="./images/tasks.svg">
            <div>Tasks</div>
            <img src="./images/communities.svg">
            <div>Communities</div>
            
            <img>
            <div></div>
            
            <img src="./images/settings.svg">
            <div>Settings</div>
            <img src="./images/support.svg">
            <div>Support</div>
            <img src="./images/privacy.svg">
            <div>Privacy</div>
        </div>
    </div>


    <div class="dashboard-section">
        <div class="header-main">
            <div class="header-top"></div>
            <div class="header-bot"></div>
        </div>

        <div class="body-main">
            <div class="body-left"></div>
            <div class="body-right">
                <div class="body-announcement"></div>
                <div class="body-trending"></div>
            </div> 
        </div>
    </div>

</body>


</html>
